<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      width: 360px;
      margin: 0;
      background: #0b1220;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      background: linear-gradient(135deg, #0f172a, #111c33);
      padding: 14px 16px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      background: #ef4444;
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      padding: 8px 10px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }
    .header h1 { margin: 0; font-size: 15px; font-weight: 700; }
    .header .sub { color: #94a3b8; font-size: 11px; }
    .body { padding: 12px 16px; }
    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #111c2e;
    }
    .toggle label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .switch { position: relative; width: 36px; height: 20px; display: inline-block; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #334155; border-radius: 20px; transition: 0.2s;
    }
    .slider:before {
      content: ""; position: absolute; height: 14px; width: 14px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: 0.2s;
    }
    input:checked + .slider { background: #16a34a; }
    input:checked + .slider:before { transform: translateX(16px); }
    .status { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #16a34a; }
    .dot.off { background: #64748b; }
    .incidents-title { font-weight: 700; margin: 14px 0 8px; display: flex; justify-content: space-between; align-items: center; }
    .incidents-title button {
      background: transparent; border: 1px solid #334155; color: #94a3b8;
      border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer;
    }
    .incidents-title button:hover { color: #e2e8f0; border-color: #475569; }
    .incident {
      border: 1px solid #1e293b;
      border-left: 4px solid #ef4444;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      background: #0f172a;
    }
    .incident.critical { border-left-color: #dc2626; }
    .incident.high { border-left-color: #f59e0b; }
    .incident .ititle { font-weight: 600; font-size: 12.5px; margin-bottom: 2px; }
    .incident .idetail { color: #94a3b8; font-size: 11px; line-height: 1.4; }
    .incident .imeta { color: #64748b; font-size: 10px; margin-top: 4px; }
    .empty { color: #64748b; text-align: center; padding: 16px 0; font-size: 12px; }
    .foot { color: #64748b; font-size: 10px; text-align: center; padding: 10px; border-top: 1px solid #111c2e; }
    .sev { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
    .sev.CRITICAL { background: #7f1d1d; color: #fecaca; }
    .sev.HIGH { background: #78350f; color: #fde68a; }
    .test-btn {
      flex: 1;
      background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
      border-radius: 8px; padding: 7px 8px; font-size: 11.5px; font-weight: 600;
      cursor: pointer; text-align: center;
    }
    .test-btn:hover { background: #334155; border-color: #475569; }
    .test-btn.ghost { background: transparent; }
    #testStatus { font-size: 11px; color: #94a3b8; margin: 2px 0 10px; min-height: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">RAKSHAK AI</div>
    <div>
      <h1>Scam Shield</h1>
      <div class="sub">Message &amp; link detection running in background</div>
    </div>
  </div>

  <div class="body">
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Checking status...</span>
    </div>

    <div style="margin: 4px 0 10px; display: flex; gap: 8px;">
      <button id="testBtn" class="test-btn">▶ Run demo test</button>
      <button id="testVoiceBtn" class="test-btn ghost">🔊 Test voice</button>
    </div>

    <div class="toggle">
      <label><span class="switch"><input type="checkbox" id="tEnabled" /><span class="slider"></span></span> Shield enabled</label>
    </div>
    <div class="toggle">
      <label><span class="switch"><input type="checkbox" id="tNotify" /><span class="slider"></span></span> Desktop notifications</label>
    </div>
    <div class="toggle">
      <label><span class="switch"><input type="checkbox" id="tBadge" /><span class="slider"></span></span> Toolbar badge alerts</label>
    </div>
    <div class="toggle">
      <label><span class="switch"><input type="checkbox" id="tOverlay" /><span class="slider"></span></span> In-page warning overlay</label>
    </div>
    <div class="toggle">
      <label><span class="switch"><input type="checkbox" id="tUrl" /><span class="slider"></span></span> Scan visited / clicked links</label>
    </div>
    <div class="toggle">
      <label><span class="switch"><input type="checkbox" id="tVoice" /><span class="slider"></span></span> Voice alert</label>
    </div>

    <div class="incidents-title">
      <span>Recent detections</span>
      <button id="clearBtn">Clear</button>
    </div>
    <div id="testStatus"></div>
    <div id="incidents"></div>
  </div>

  <div class="foot">Rakshak AI &bull; Cyber Scam Shield &bull; National Helpline 1930</div>

  <script src="popup.js"></script>
</body>
</html>
